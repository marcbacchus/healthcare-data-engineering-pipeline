version: 2

models:
  - name: fct_provider_payments
    description: >
      One row per CMS Open Payments record.
      Grain: individual payment transaction.
      Source: stg_cms_open_payments (CMS program year 2023).
    columns:
      - name: payment_id
        description: "CMS record_id — unique per payment"
        tests:
          - not_null
          - unique
      - name: payment_amount_usd
        description: "Total payment amount in USD"
        tests:
          - not_null
      - name: payment_date
        tests:
          - not_null
      - name: paying_manufacturer
        tests:
          - not_null

  - name: fct_adverse_events
    description: >
      One row per FDA FAERS adverse event report.
      Grain: individual report submission (primaryid).
      Source: stg_faers_demo (Q4 2024).
    columns:
      - name: report_id
        description: "FAERS primaryid — unique per report"
        tests:
          - not_null
          - unique
      - name: initial_or_followup
        description: >
          I=initial report, F=follow-up report. KNOWN LIMITATION: sourced
          from openFDA's i_f_cod field, which this API endpoint never
          populates — this column is always NULL for every row in this
          dataset (see docs/data_dictionary.md). Kept in the schema
          deliberately rather than dropped, so the limitation is visible
          in the mart itself, not just in separate documentation.
        tests:
          - accepted_values:
              arguments:
                values: ['I', 'F']
                quote: true
      - name: is_initial_report
        description: >
          Derived as (initial_or_followup = 'I'). Always NULL for the same
          reason initial_or_followup is always NULL — NULL = 'I' evaluates
          to NULL, not FALSE. Not a bug; downstream consumers (including
          the Phase 5 SQL and RAG tools) correctly report this as a data
          limitation rather than guessing when asked about it.
      - name: patient_sex
        description: >
          Recoded from openFDA's numeric patientsex field (1=Male, 2=Female,
          0=Unknown) — see patient_sex_raw for the original code.
        tests:
          - accepted_values:
              arguments:
                values: ['M', 'F', 'U']
                quote: true
      - name: reporter_occupation
        description: >
          Recoded from openFDA's numeric primarysource.qualification field —
          see reporter_occupation_raw for the original code.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'physician'
                  - 'pharmacist'
                  - 'other health professional'
                  - 'lawyer'
                  - 'consumer or non-health professional'
                  - 'other'
                quote: true

  - name: mart_patient_risk
    description: >
      One row per Synthea synthetic patient with computed clinical risk features.
      Grain: patient.
      Drives cohort selection in Phase 4 (Databricks Feature Store + ML models).
    columns:
      - name: patient_id
        description: "Synthea patient UUID — primary key"
        tests:
          - not_null
          - unique
      - name: risk_tier
        description: "Clinical risk stratification: high / medium / low based on comorbidity score"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
                quote: true
      - name: comorbidity_score
        description: "Count of active conditions per patient at time of data generation"
        tests:
          - not_null
      - name: polypharmacy_flag
        description: "True when comorbidity_score >= 5 (proxy; Phase 4 will use medication count)"
        tests:
          - not_null
